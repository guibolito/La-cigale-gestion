function tbody(id){

}
const kpi=(l,v,s='',cls='')=>`<div class="card kpi ${cls}"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;

  {const seen=new Set(),dup=[];S.factures.concat(S.devis).forEach(x=>{if(!x.num)return;if(seen.has(x.num))dup.push(x.num);seen.add(x.num)});if(dup.length)al.push(`<div class="alert bad">${I('inv',18)}<span><b>Numéros en double :</b> ${esc([...new Set(dup)].join(', '))}. Cela arrive si vous créez un document en même temps à deux : corrigez-en un.</span></div>`)}

function saveFacture(id){

    if(o2.statut==='Annulée'&&prev.statut!=='Annulée'&&paidOf(prev)>0.004){toast('Cette facture a des règlements : supprimez-les ou faites un avoir avant de l’annuler.');return}

  }

}

const jfInner=()=>JF.id?`<div class="row" style="gap:10px"><a href="${esc(JF.url)}" target="_blank" rel="noopener">Voir le justificatif</a><span class="sp"></span><button class="btn sm" data-a="jfDel" type="button">Retirer</button></div>`:`<input type="file" id="jf-file" accept="image/*,application/pdf" aria-label="Ajouter un justificatif">`;
async function shrink(file){
  if(!/^image\//.test(file.type))return file;
  try{const bmp=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.8))}catch{return file}
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='jf-file'||!e.target.files[0]||!ast)return;
  const box=$('#jf-box'); jfBusy=true; box.innerHTML='<span class="muted">Envoi en cours…</span>';
  try{const b=await shrink(e.target.files[0]);const r=await ast.upload(b);JF={id:r.id,url:r.url};toast('Justificatif ajouté.')}catch(err){console.error(err);toast('Envoi impossible (droits d’édition requis ou fichier trop lourd).')}
  jfBusy=false; const bx=$('#jf-box'); if(bx)bx.innerHTML=jfInner();
});

const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function palItems(q){
  const n=norm(q).trim(), out=[];
  const cmds=[['Nouveau devis','newDevis'],['Ajouter une facture','newFacture'],['Nouvelle dépense','newDepense'],['Nouveau client','newClient'],['Nouveau chantier','newChantier'],['Nouveau prospect','newLead'],['Nouvelle tâche','newTache']].map(c=>({g:'Actions',t:c[0],a:c[1],ic:'plus'}));
  const pages=PAGES.map(p=>({g:'Pages',t:p[1],a:'go',h:p[0],ic:p[2]}));
  const data=[
   ...S.clients.map(x=>({g:'Clients',t:x.nom,s:x.ville||x.tel||'',a:'openClient',id:x.id,ic:'users',k:[x.nom,x.ville,x.tel,x.email]})),
   ...S.leads.map(x=>({g:'Prospects',t:x.nom,s:x.etape,a:'openLead',id:x.id,ic:'funnel',k:[x.nom,x.ville,x.tel,x.besoin]})),
   ...S.devis.map(x=>({g:'Devis',t:(x.num||'Brouillon')+' · '+cliName(x.clientId),s:dStatut(x),a:'openDevis',id:x.id,ic:'doc',k:[x.num,cliName(x.clientId),x.titre]})),
   ...S.factures.map(x=>({g:'Factures',t:(x.num||'Brouillon')+' · '+cliName(x.clientId),s:fStatut(x),a:'openFacture',id:x.id,ic:'inv',k:[x.num,cliName(x.clientId)]})),
   ...S.chantiers.map(x=>({g:'Chantiers',t:x.num+' · '+(x.titre||''),s:x.statut,a:'openChantier',id:x.id,ic:'tool',k:[x.num,x.titre,cliName(x.clientId)]}))
  ];
  if(!n)return [...cmds,...pages.slice(0,0)];
  const hit=a=>a.filter(x=>norm([x.t,...(x.k||[])].join(' ')).includes(n));
  return [...hit(cmds),...hit(pages),...hit(data)].slice(0,14);
}

}

  S.leads.filter(l=>l.etape==='Nouveau'&&!l.prochaine&&(l.created||t)<addDays(t,-1)).forEach(l=>out.push({k:'Prospect sans suite',t:l.nom,d:l.created,a:'openLead',id:l.id,ic:'funnel'}));

/* ---- Trésorerie, TVA ---- */
function recMonth(r,ym){return r.actif!==false&&S.depenses.some(x=>x.recId===r.id&&x.date.startsWith(ym))}
function forecast(weeks=13){
  const t=today(), out=[]; let solde=tresorerie();
  const ev=[]; impayes().l.forEach(f=>ev.push([f.echeance&&f.echeance>t?f.echeance:t,resteOf(f),'enc']));
  S.depenses.filter(x=>x.payee===false).forEach(x=>ev.push([x.date>t?x.date:t,-x.ttc,'dep']));
  for(let w=0;w<weeks;w++){const a=addDays(t,w*7),b=addDays(t,w*7+6);let enc=0,dep=0;
    ev.forEach(e=>{if(e[0]>=a&&e[0]<=b)e[1]>0?enc+=e[1]:dep+=e[1]});
    S.recurrentes.filter(r=>r.actif!==false).forEach(r=>{for(let m=0;m<4;m++){const d0=addMonths(a,m).slice(0,7)+'-'+pad(Math.min(28,+r.jour||1));if(d0>=a&&d0<=b)dep-=(+r.ttc||0)}});
    solde+=enc+dep;out.push({a,enc,dep,solde})}
  return out;
}

const _csvOf=csvOf;
csvOf=function(col){
  if(col!=='journal')return _csvOf(col);
  const rows=[];
  facturesValides().forEach(f=>{const t=fTot(f);rows.push([f.date,'Vente',f.num,cliName(f.clientId),t.ht,t.tva,t.ttc]);S.paiements.filter(p=>p.factureId===f.id).forEach(p=>rows.push([p.date,'Règlement client',f.num,cliName(f.clientId),'','',p.montant]))});
  S.depenses.forEach(x=>rows.push([x.date,'Achat',x.categorie,x.fournisseur||x.libelle,-x.ht,-((+x.ttc||0)-(+x.ht||0)),-x.ttc]));
  rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  return '﻿'+['Date;Type;Pièce;Tiers;HT;TVA;TTC',...rows.map(r=>r.map(csvCell).join(';'))].join('\r\n');
};

function calEvents(){
  const ev=[], add=(d,x)=>{if(d)ev.push({d,...x})};
  S.chantiers.forEach(c=>{if(!c.debut)return;const end=c.finReelle||c.finPrevue||c.debut;let d=c.debut,n=0;while(d<=end&&n<90){ev.push({d,k:'ch',t:c.num+' '+cliName(c.clientId),a:'openChantier',id:c.id});d=addDays(d,1);n++}});
  S.clients.forEach(c=>c.entretien&&c.entretien.formule&&add(c.entretien.prochaine,{k:'ent',t:'Entretien '+c.nom,a:'openClient',id:c.id}));
  S.taches.filter(x=>!x.fait).forEach(x=>add(x.echeance,{k:'ta',t:x.titre,a:'tacheOpen',id:x.id}));
  S.leads.filter(l=>PROB[l.etape]!==undefined).forEach(l=>add(l.prochaine,{k:'le',t:'Rappeler '+l.nom,a:'openLead',id:l.id}));
  impayes().l.forEach(f=>add(f.echeance,{k:'fa',t:'Échéance '+f.num+' · '+eur0(resteOf(f)),a:'openFacture',id:f.id}));

const XL_NAMES={clients:'Clients',devis:'Devis',chantiers:'Chantiers',factures:'Factures',depenses:'Dépenses',journal:'Journal comptable',registre:'Registre fluides'};
function parseCsv(t){
  t=t.replace(/^\ufeff/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true; else if(ch===';'){r.push(c);c=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''} else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)} return rows;
}
function sheetOf(col){
  const rows=parseCsv(csvOf(col)); if(!rows.length)return XLSX.utils.aoa_to_sheet([[]]);
  const hd=rows[0], keep=hd.map(h=>/(tel|téléphone|^cp$|n°|série|serie|pièce|piece)/i.test(h));
  const out=rows.map((r,ri)=>ri===0?r:r.map((v,ci)=>{
    if(keep[ci]||v==='')return v;
    if(/^-?\d+(\.\d+)?$/.test(v))return +v;
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,d]=v.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
    return v}));
  const ws=XLSX.utils.aoa_to_sheet(out,{cellDates:true});
  ws['!cols']=hd.map((h,i)=>({wch:Math.min(40,Math.max(String(h).length+2,...rows.slice(1,60).map(r=>String(r[i]||'').length+2)))}));
  ws['!freeze']={xSplit:0,ySplit:1}; ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,out.length-1),c:Math.max(0,hd.length-1)}})};
  Object.keys(ws).forEach(k=>{const c=ws[k];if(c&&c.t==='d'){c.z='dd/mm/yyyy'}else if(c&&c.t==='n'&&k[0]!=='!'){const h=hd[XLSX.utils.decode_cell(k).c]||'';if(/(€|ht|tva|ttc|payé|reste|total|marge|coût|achat|ajouté|récupéré|charge)/i.test(h)&&!/taux/i.test(h))c.z='#,##0.00'}});
  return ws;
}
async function exportXlsx(cols,filename){
  if(typeof XLSX==='undefined'){toast('Le module Excel n’est pas chargé : utilisez le CSV.');return}
  const wb=XLSX.utils.book_new();
  cols.forEach(c=>{const n=XL_NAMES[c]||c;XLSX.utils.book_append_sheet(wb,sheetOf(c),n.slice(0,31))});
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
  await dlSave(filename,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
